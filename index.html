<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N13 — Badai Kehidupan</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#101a24;font-family:Arial,Helvetica,sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:16px}
.post{width:min(calc(100vw - 32px),720px);aspect-ratio:1/1;position:relative;overflow:hidden;isolation:isolate;background:#15384b;color:#fff;box-shadow:0 24px 80px #0008}
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;filter:saturate(.88) contrast(1.04)}
.shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,#05121d26 0%,transparent 36%,#050f19e8 100%),linear-gradient(90deg,#05142040,transparent 65%)}
.grain{position:absolute;inset:0;z-index:-1;opacity:.12;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")}
.top{position:absolute;top:6.2%;left:7%;right:7%;display:flex;align-items:center;justify-content:space-between;letter-spacing:.22em;font-size:clamp(9px,1.55vw,13px);font-weight:700;text-transform:uppercase}
.line{width:34px;height:1px;background:#ffffffb3}
.content{position:absolute;left:7%;right:7%;bottom:7%}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:#f6c7a7;font-size:clamp(9px,1.5vw,13px);font-weight:700;letter-spacing:.28em;text-transform:uppercase}
.eyebrow:before{content:"";width:27px;height:1px;background:#f6c7a7}
h1{margin:0;max-width:90%;font-size:clamp(40px,9.3vw,86px);line-height:.88;letter-spacing:-.065em;font-weight:900;text-transform:uppercase;text-shadow:0 4px 24px #0003}
.subtitle{margin-top:15px;font-size:clamp(13px,2.25vw,20px);line-height:1.45;color:#ffffffdf;max-width:78%}
.bottom{margin-top:25px;padding-top:13px;border-top:1px solid #ffffff61;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:clamp(8px,1.35vw,11px);letter-spacing:.18em;font-weight:700;text-transform:uppercase}
.listen{border:1px solid #ffffffbf;border-radius:99px;padding:9px 14px;white-space:nowrap}
@media(max-width:420px){body{padding:0;background:#000}.post{width:100vw;box-shadow:none}.content{bottom:6%}.subtitle{max-width:90%}}
</style>
</head>
<body>
<main class="post" aria-label="Desain Instagram N13 Badai Kehidupan">
<img class="cover" src="assets/cover.webp" alt="Sampul album N13 Badai Kehidupan">
<div class="shade"></div><div class="grain"></div>
<div class="top"><span>N13</span><span class="line"></span><span>Music Project</span></div>
<section class="content">
<div class="eyebrow">Album</div>
<h1>Badai<br>Kehidupan</h1>
<p class="subtitle">Tidak semua perjalanan berjalan mudah. Ada cerita yang hanya bisa dipahami setelah kita melewati badai.</p>
<div class="bottom"><span>N13 · Original Album</span><span class="listen">Dengarkan sekarang</span></div>
</section>
</main>
</body>
</html>
