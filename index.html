<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#dedddd">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<title>N13 — Badai Kehidupan | Instagram Visual</title>
<style>
:root{--bg:#dedddd;--panel:#292929;--white:#f2f2f2;--muted:#b9b9b9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#171717}
body{display:grid;place-items:center;min-height:100svh;padding:18px}
.stage{width:min(100%,540px);aspect-ratio:9/16;position:relative;overflow:hidden;background:var(--bg);isolation:isolate}
.device{position:absolute;width:77%;height:84%;left:11.5%;top:8.1%;filter:drop-shadow(0 13px 12px #0002)}
.silhouette{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.silhouette path{fill:var(--panel)}
.drip{transform-box:fill-box;transform-origin:50% 0%;will-change:transform}
.drip-one{animation:drip-sway 4.8s ease-in-out infinite}
.drip-two{animation:drip-stretch 5.6s ease-in-out infinite}
.drip-three{animation:drip-sway 4.2s ease-in-out -1.4s infinite}
.drip-four{animation:drip-stretch 5.1s ease-in-out -2s infinite}
@keyframes drip-sway{0%,100%{transform:scaleY(1) translateY(0)}50%{transform:scaleY(1.035) translateY(3px)}}
@keyframes drip-stretch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.045) translateY(4px)}}
@media(prefers-reduced-motion:reduce){.drip{animation:none}}
.player-content{position:absolute;left:6.5%;right:6.5%;top:3.4%;height:72%;color:var(--white);display:flex;flex-direction:column}
.artwork{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8%;display:block;background:#111}
.track{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:5.4%}
.track-copy{min-width:0}
.track h1{font-size:clamp(17px,4.1vw,29px);font-weight:700;line-height:1.1;margin:0;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:clamp(13px,2.8vw,20px);color:var(--muted);margin:7px 0 0}
.material-symbols-rounded{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:clamp(22px,5vw,32px);line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased;user-select:none}.heart{color:#ddd;margin-right:1%;font-size:clamp(24px,5vw,34px)}
.progress{margin-top:8.5%}
.trackbar{height:5px;background:#696969;border-radius:10px;position:relative}
.trackbar:before{content:"";position:absolute;left:0;top:0;bottom:0;width:32%;background:#eee;border-radius:10px}
.trackbar:after{content:"";position:absolute;left:32%;top:50%;width:15px;height:15px;background:#eee;border-radius:50%;transform:translate(-50%,-50%)}
.times{display:flex;justify-content:space-between;margin-top:11px;font-size:clamp(10px,2.3vw,15px);color:#ddd}
.controls{display:flex;align-items:center;justify-content:space-between;margin-top:5.5%;height:15%;color:#e9e9e9}
.ctrl{font-size:clamp(23px,5vw,34px);line-height:1;white-space:nowrap;display:grid;place-items:center}
.ctrl.small{font-size:clamp(20px,4.4vw,29px);color:#c7c7c7}
.play{width:clamp(58px,14vw,86px);height:clamp(58px,14vw,86px);border-radius:50%;background:#f0f0f0;color:#292929;display:grid;place-items:center;font-size:clamp(31px,7vw,43px);font-weight:400}
.brand{position:absolute;bottom:3.1%;left:0;right:0;text-align:center;color:#777;font-size:clamp(9px,2vw,12px);letter-spacing:.28em;font-weight:700}
@media(max-width:420px){body{padding:0}.stage{width:100vw}}
</style>
</head>
<body>
<main class="stage" aria-label="Template konten Instagram N13 format 9 banding 16">
  <section class="device" aria-label="Ilustrasi pemutar musik dengan bentuk lelehan">
    <svg class="silhouette" viewBox="0 0 700 1350" preserveAspectRatio="none" aria-hidden="true">
      <path class="body-shape" d="M86 12 Q20 12 20 80 L20 1015 Q20 1080 80 1090 Q100 1098 120 1098 L580 1098 Q620 1098 640 1080 Q680 1055 680 1010 L680 80 Q680 12 614 12 Z"/>
      <path class="drip drip-one" d="M112 1080 Q145 1080 145 1120 L145 1218 Q145 1260 170 1260 Q196 1260 196 1218 L196 1120 Q196 1080 230 1080 Z"/>
      <path class="drip drip-two" d="M270 1080 Q300 1080 300 1125 L300 1310 Q300 1340 326 1340 Q352 1340 352 1310 L352 1125 Q352 1080 382 1080 Z"/>
      <path class="drip drip-three" d="M405 1080 Q420 1080 420 1120 Q420 1210 450 1210 Q475 1210 475 1175 L475 1120 Q475 1080 505 1080 Z"/>
      <path class="drip drip-four" d="M510 1080 Q540 1080 540 1125 L540 1240 Q540 1280 565 1280 Q590 1280 590 1240 L590 1125 Q590 1080 620 1080 Z"/>
    </svg>
    <div class="player-content">
      <img class="artwork" src="badai-kehidupan.webp" alt="Artwork album Badai Kehidupan N13">
      <div class="track">
        <div class="track-copy"><h1>Pagi yang Berat</h1><p class="artist">N13</p></div>
        <span class="material-symbols-rounded heart" aria-hidden="true">favorite_border</span>
      </div>
      <div class="progress">
        <div class="trackbar"></div>
        <div class="times"><span>1:27</span><span>-3:22</span></div>
      </div>
      <div class="controls" aria-hidden="true">
        <span class="material-symbols-rounded ctrl small">shuffle</span><span class="material-symbols-rounded ctrl">skip_previous</span><span class="material-symbols-rounded play">pause</span><span class="material-symbols-rounded ctrl">skip_next</span><span class="material-symbols-rounded ctrl small">repeat</span>
      </div>
    </div>
  </section>
  <div class="brand">N13 · BADAI KEHIDUPAN</div>
</main>
</body>
</html>
