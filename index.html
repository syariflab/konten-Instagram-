<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#dedddd">
<title>N13 — Badai Kehidupan | Instagram Visual</title>
<style>
:root{--bg:#dedddd;--panel:#292929;--white:#f2f2f2;--muted:#b9b9b9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#171717}
body{display:grid;place-items:center;min-height:100svh;padding:18px}
.stage{width:min(100%,540px);aspect-ratio:9/16;position:relative;overflow:hidden;background:var(--bg);isolation:isolate}
.device{position:absolute;width:77%;height:84%;left:11.5%;top:8.1%;filter:drop-shadow(0 13px 12px #0002)}
.silhouette{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.silhouette path{fill:var(--panel)}
.player-content{position:absolute;left:6.5%;right:6.5%;top:3.4%;height:72%;color:var(--white);display:flex;flex-direction:column}
.artwork{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8%;display:block;background:#111}
.track{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:5.4%}
.track-copy{min-width:0}
.track h1{font-size:clamp(17px,4.1vw,29px);font-weight:700;line-height:1.1;margin:0;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:clamp(13px,2.8vw,20px);color:var(--muted);margin:7px 0 0}
.heart{font-size:clamp(23px,5vw,34px);font-weight:300;line-height:1;color:#ddd;margin-right:1%}
.progress{margin-top:8.5%}
.trackbar{height:5px;background:#696969;border-radius:10px;position:relative}
.trackbar:before{content:"";position:absolute;left:0;top:0;bottom:0;width:32%;background:#eee;border-radius:10px}
.trackbar:after{content:"";position:absolute;left:32%;top:50%;width:15px;height:15px;background:#eee;border-radius:50%;transform:translate(-50%,-50%)}
.times{display:flex;justify-content:space-between;margin-top:11px;font-size:clamp(10px,2.3vw,15px);color:#ddd}
.controls{display:flex;align-items:center;justify-content:space-between;margin-top:5.5%;height:15%;color:#e9e9e9}
.ctrl{font-size:clamp(19px,4.6vw,31px);line-height:1;white-space:nowrap}
.ctrl.small{font-size:clamp(18px,4vw,26px);color:#c7c7c7}
.play{width:clamp(58px,14vw,86px);height:clamp(58px,14vw,86px);border-radius:50%;background:#f0f0f0;color:#292929;display:grid;place-items:center;font-size:clamp(24px,5.5vw,38px);font-weight:700;padding-left:4px}
.volume{display:flex;align-items:center;gap:12px;margin:5.5% 1% 0;color:#bdbdbd;font-size:clamp(14px,3vw,21px)}
.volume-line{height:4px;background:#777;border-radius:9px;flex:1;position:relative}
.volume-line:before{content:"";position:absolute;left:0;top:0;bottom:0;width:80%;background:#eee;border-radius:9px}
.volume-line:after{content:"";position:absolute;left:80%;top:50%;width:17px;height:17px;border-radius:50%;background:#eee;transform:translate(-50%,-50%)}
.brand{position:absolute;bottom:3.1%;left:0;right:0;text-align:center;color:#777;font-size:clamp(9px,2vw,12px);letter-spacing:.28em;font-weight:700}
@media(max-width:420px){body{padding:0}.stage{width:100vw}}
</style>
</head>
<body>
<main class="stage" aria-label="Template konten Instagram N13 format 9 banding 16">
  <section class="device" aria-label="Ilustrasi pemutar musik dengan bentuk lelehan">
    <svg class="silhouette" viewBox="0 0 700 1350" preserveAspectRatio="none" aria-hidden="true">
      <path d="M86 12 Q20 12 20 80 L20 1015 Q20 1080 80 1090 C130 1098 145 1120 145 1170 L145 1218 Q145 1260 170 1260 Q196 1260 196 1218 L196 1170 Q196 1125 235 1125 Q280 1125 300 1170 L300 1310 Q300 1340 326 1340 Q352 1340 352 1310 L352 1190 Q352 1145 385 1145 Q415 1145 420 1180 Q425 1210 450 1210 Q475 1210 475 1175 Q475 1140 505 1140 Q540 1140 540 1185 L540 1240 Q540 1280 565 1280 Q590 1280 590 1240 L590 1170 Q590 1110 630 1090 Q680 1070 680 1010 L680 80 Q680 12 614 12 Z"/>
    </svg>
    <div class="player-content">
      <img class="artwork" src="badai-kehidupan.webp" alt="Artwork album Badai Kehidupan N13">
      <div class="track">
        <div class="track-copy"><h1>Pagi yang Berat</h1><p class="artist">N13</p></div>
        <span class="heart" aria-hidden="true">♡</span>
      </div>
      <div class="progress">
        <div class="trackbar"></div>
        <div class="times"><span>1:27</span><span>-3:22</span></div>
      </div>
      <div class="controls" aria-hidden="true">
        <span class="ctrl small">⤨</span><span class="ctrl">◀❙</span><span class="play">Ⅱ</span><span class="ctrl">❙▶</span><span class="ctrl small">↻</span>
      </div>
      <div class="volume" aria-hidden="true"><span>◀</span><div class="volume-line"></div><span>◖))</span></div>
    </div>
  </section>
  <div class="brand">N13 · BADAI KEHIDUPAN</div>
</main>
</body>
</html>
