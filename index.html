<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#dedddd">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<title>N13 — Badai Kehidupan | Instagram Visual</title>
<style>
:root{--bg:#dedddd;--panel:#292929;--white:#f2f2f2;--muted:#b9b9b9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#171717}
body{display:grid;place-items:center;min-height:100svh;padding:18px}
.stage{width:min(100%,540px);aspect-ratio:9/16;position:relative;overflow:hidden;background:var(--bg);isolation:isolate}
.device{position:absolute;width:77%;height:84%;left:11.5%;top:8.1%;filter:drop-shadow(0 17px 15px #0003) drop-shadow(0 3px 3px #0002)}
.silhouette{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.silhouette path{fill:var(--panel);filter:drop-shadow(0 2px 2px #0002)}
.player-content{position:absolute;left:6.5%;right:6.5%;top:3.4%;height:72%;color:var(--white);display:flex;flex-direction:column}
.artwork{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8%;display:block;background:#111;box-shadow:0 8px 17px #0005,0 2px 4px #0004}
.track{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:5.4%}
.track-copy{min-width:0}
.track h1{cursor:text;outline:none;border-radius:3px}.track h1:focus{box-shadow:0 2px 0 #ffffff99}.track h1{font-size:clamp(17px,4.1vw,29px);font-weight:700;line-height:1.1;margin:0;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 5px #0005}
.artist{font-size:clamp(13px,2.8vw,20px);color:var(--muted);margin:7px 0 0;text-shadow:0 1px 3px #0005}
.material-symbols-rounded{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:clamp(22px,5vw,32px);line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased;user-select:none}.heart{color:#ddd;margin-right:1%;font-size:clamp(24px,5vw,34px);filter:drop-shadow(0 2px 3px #0008)}
.progress{margin-top:8.5%}
.trackbar{height:5px;background:#696969;border-radius:10px;position:relative;box-shadow:inset 0 1px 2px #0008,0 1px 2px #fff1;--progress:30.1%}
.trackbar:before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--progress);background:#eee;border-radius:10px;box-shadow:0 0 5px #fff8;pointer-events:none}
.trackbar:after{content:"";position:absolute;left:var(--progress);top:50%;width:15px;height:15px;background:#eee;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 2px 5px #0008,0 0 2px #fff;pointer-events:none}
.seek{position:absolute;z-index:2;left:0;top:-12px;width:100%;height:29px;margin:0;opacity:0;cursor:pointer;touch-action:pan-y}
.trackbar:focus-within{outline:2px solid #ffffff80;outline-offset:5px}
.times{display:flex;justify-content:space-between;margin-top:11px;font-size:clamp(10px,2.3vw,15px);color:#ddd;text-shadow:0 1px 3px #0008}
.controls{display:flex;align-items:center;justify-content:space-between;margin-top:5.5%;height:15%;color:#e9e9e9}
.ctrl{font-size:clamp(23px,5vw,34px);line-height:1;white-space:nowrap;display:grid;place-items:center;filter:drop-shadow(0 2px 2px #0008)}
.ctrl.small{font-size:clamp(20px,4.4vw,29px);color:#c7c7c7}
.play{width:clamp(58px,14vw,86px);height:clamp(58px,14vw,86px);border-radius:50%;background:#f0f0f0;color:#292929;display:grid;place-items:center;font-size:clamp(31px,7vw,43px);font-weight:400;box-shadow:0 5px 11px #0006,0 1px 2px #fff8}
.brand{position:absolute;bottom:3.1%;left:0;right:0;text-align:center;color:#777;font-size:clamp(9px,2vw,12px);letter-spacing:.28em;font-weight:700;text-shadow:0 1px 1px #fff8}
@media(max-width:420px){body{padding:0}.stage{width:100vw}}
.ss-button{position:fixed;z-index:10;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:13px 22px;border:0;border-radius:999px;background:#f2f2f2;color:#171717;font-size:14px;font-weight:700;box-shadow:0 5px 18px #0005;cursor:pointer;white-space:nowrap}
.ss-button:disabled{opacity:.65;cursor:wait}
.ss-button .material-symbols-rounded{font-size:20px}
@media(max-width:420px){.ss-button{bottom:14px}}
</style>
</head>
<body>
<main class="stage" aria-label="Template konten Instagram N13 format 9 banding 16">
  <section class="device" aria-label="Ilustrasi pemutar musik dengan bentuk lelehan">
    <svg class="silhouette" viewBox="0 0 700 1350" preserveAspectRatio="none" aria-hidden="true">
      <path d="M86 12 Q20 12 20 80 L20 1015 Q20 1080 80 1090 C130 1098 145 1120 145 1170 L145 1218 Q145 1260 170 1260 Q196 1260 196 1218 L196 1170 Q196 1125 235 1125 Q280 1125 300 1170 L300 1310 Q300 1340 326 1340 Q352 1340 352 1310 L352 1190 Q352 1145 385 1145 Q415 1145 420 1180 Q425 1210 450 1210 Q475 1210 475 1175 Q475 1140 505 1140 Q540 1140 540 1185 L540 1240 Q540 1280 565 1280 Q590 1280 590 1240 L590 1170 Q590 1110 630 1090 Q680 1070 680 1010 L680 80 Q680 12 614 12 Z"/>
    </svg>
    <div class="player-content">
      <img class="artwork" src="menuju-hari-yang-akan-datang.webp" alt="Artwork album Badai Kehidupan N13">
      <div class="track">
        <div class="track-copy"><h1 contenteditable="true" spellcheck="false" role="textbox" aria-label="Edit judul lagu" title="Ketuk untuk mengubah judul">Pagi yang Berat</h1><p class="artist">N13</p></div>
        <span class="material-symbols-rounded heart" aria-hidden="true">favorite_border</span>
      </div>
      <div class="progress">
        <div class="trackbar" id="trackbar">
          <input class="seek" id="seek" type="range" min="0" max="289" value="87" step="1" aria-label="Geser posisi durasi lagu" aria-valuetext="1 menit 27 detik dari 4 menit 49 detik">
        </div>
        <div class="times"><span id="elapsed">1:27</span><span id="remaining">-3:22</span></div>
      </div>
      <div class="controls" aria-hidden="true">
        <span class="material-symbols-rounded ctrl small">shuffle</span><span class="material-symbols-rounded ctrl">skip_previous</span><span class="material-symbols-rounded play">pause</span><span class="material-symbols-rounded ctrl">skip_next</span><span class="material-symbols-rounded ctrl small">repeat</span>
      </div>
    </div>
  </section>
  <div class="brand">N13 · BADAI KEHIDUPAN</div>
</main>
<button class="ss-button" id="saveImage" type="button">
  <span class="material-symbols-rounded" aria-hidden="true">photo_camera</span>
  <span id="saveLabel">SS 1080p</span>
</button>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
(() => {
  const seek = document.getElementById('seek');
  const trackbar = document.getElementById('trackbar');
  const elapsed = document.getElementById('elapsed');
  const remaining = document.getElementById('remaining');
  const duration = Number(seek.max);

  const formatTime = (seconds) => {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return mins + ':' + String(secs).padStart(2, '0');
  };

  const updateSeek = () => {
    const current = Number(seek.value);
    const percent = (current / duration) * 100;
    trackbar.style.setProperty('--progress', percent + '%');
    elapsed.textContent = formatTime(current);
    remaining.textContent = '-' + formatTime(duration - current);
    seek.setAttribute('aria-valuetext',
      formatTime(current) + ' dari ' + formatTime(duration));
  };

  seek.addEventListener('input', updateSeek);
  updateSeek();

  const saveButton = document.getElementById('saveImage');
  const saveLabel = document.getElementById('saveLabel');
  const stage = document.querySelector('.stage');

  saveButton.addEventListener('click', async () => {
    if (typeof html2canvas === 'undefined') {
      alert('Fitur screenshot belum termuat. Periksa koneksi internet lalu coba lagi.');
      return;
    }

    const originalLabel = saveLabel.textContent;
    saveButton.disabled = true;
    saveLabel.textContent = 'Menyiapkan gambar...';

    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      const artwork = document.querySelector('.artwork');
      if (artwork && !artwork.complete) {
        await new Promise((resolve) => {
          artwork.onload = resolve;
          artwork.onerror = resolve;
        });
      }

      const rect = stage.getBoundingClientRect();
      const scale = 1080 / rect.width;
      const canvas = await html2canvas(stage, {
        scale,
        width: rect.width,
        height: rect.height,
        backgroundColor: '#dedddd',
        useCORS: true,
        logging: false
      });

      const output = document.createElement('canvas');
      output.width = 1080;
      output.height = 1920;
      const context = output.getContext('2d');
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = 'high';
      context.drawImage(canvas, 0, 0, 1080, 1920);

      const link = document.createElement('a');
      link.download = 'N13-Badai-Kehidupan-1080x1920.png';
      link.href = output.toDataURL('image/png');
      link.click();
      saveLabel.textContent = 'Tersimpan';
    } catch (error) {
      console.error('Gagal membuat screenshot:', error);
      alert('Gagal membuat gambar. Coba muat ulang halaman dan pastikan koneksi internet aktif.');
      saveLabel.textContent = originalLabel;
    } finally {
      saveButton.disabled = false;
      if (saveLabel.textContent === 'Tersimpan') {
        setTimeout(() => { saveLabel.textContent = originalLabel; }, 1800);
      }
    }
  });
})();
</script>
</body>
</html>
